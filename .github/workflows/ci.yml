name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: |
            pnpm-lock.yaml
            ui/pnpm-lock.yaml

      - name: Check Rust code formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy lints on workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install UI dependencies
        run: pnpm --dir ui install --frozen-lockfile

      - name: Typecheck and build UI
        run: pnpm --dir ui build

  test-and-build:
    name: Test & Build (${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_binary: knox-linux-amd64
            binary_path: target/release/knox
            bundle_args: --no-bundle
          - os: macos-latest
            artifact_binary: knox-macos-amd64
            binary_path: target/release/knox
            bundle_args: --no-bundle
          - os: windows-latest
            artifact_binary: knox-windows-amd64
            binary_path: target/release/knox.exe
            bundle_args: --bundles nsis
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies (WebKit2GTK & build tools)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: |
            pnpm-lock.yaml
            ui/pnpm-lock.yaml

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install UI dependencies
        run: pnpm --dir ui install --frozen-lockfile

      - name: Build UI assets
        run: pnpm --dir ui build

      - name: Run full workspace test suite
        run: cargo test --workspace --verbose

      - name: Build release binary and bundles
        run: pnpm tauri build ${{ matrix.bundle_args }}

      - name: Verify build outputs exist
        shell: bash
        run: |
          if [ ! -f "${{ matrix.binary_path }}" ]; then
            echo "Error: Release binary not found at ${{ matrix.binary_path }}"
            exit 1
          fi
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            ls target/release/bundle/nsis/*.exe >/dev/null 2>&1 || {
              echo "Error: Windows NSIS installer not found in target/release/bundle/nsis/"
              exit 1
            }
          fi

      - name: Upload compiled binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_binary }}
          path: ${{ matrix.binary_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows NSIS installer
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: knox-installer-windows-amd64
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

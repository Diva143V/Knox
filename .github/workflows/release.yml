name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    name: Build Release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: knox-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz
            binary: target/x86_64-unknown-linux-gnu/release/knox
            bundle_args: --no-bundle
            use_zip: false
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: knox-${{ github.ref_name }}-x86_64-apple-darwin.tar.gz
            binary: target/x86_64-apple-darwin/release/knox
            bundle_args: --no-bundle
            use_zip: false
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: knox-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz
            binary: target/aarch64-apple-darwin/release/knox
            bundle_args: --no-bundle
            use_zip: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: knox-${{ github.ref_name }}-x86_64-pc-windows-msvc.zip
            binary: target/x86_64-pc-windows-msvc/release/knox.exe
            bundle_args: --bundles nsis
            use_zip: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: |
            pnpm-lock.yaml
            ui/pnpm-lock.yaml

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install UI dependencies
        run: pnpm --dir ui install --frozen-lockfile

      - name: Build UI assets
        run: pnpm --dir ui build

      - name: Build release binary and bundles
        run: pnpm tauri build --target ${{ matrix.target }} ${{ matrix.bundle_args }}

      - name: Verify build outputs exist
        shell: bash
        run: |
          if [ ! -f "${{ matrix.binary }}" ]; then
            echo "Error: Release binary not found at ${{ matrix.binary }}"
            exit 1
          fi
          if [ "${{ matrix.use_zip }}" = "true" ]; then
            ls target/${{ matrix.target }}/release/bundle/nsis/*.exe >/dev/null 2>&1 || {
              echo "Error: Windows NSIS installer not found in target/${{ matrix.target }}/release/bundle/nsis/"
              exit 1
            }
          fi

      - name: Package release archives (Unix)
        if: ${{ !matrix.use_zip }}
        run: |
          chmod +x "${{ matrix.binary }}"
          tar -czvf "${{ matrix.archive }}" -C "$(dirname "${{ matrix.binary }}")" "$(basename "${{ matrix.binary }}")"
          shasum -a 256 "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"

      - name: Package release archives (Windows)
        if: ${{ matrix.use_zip }}
        shell: pwsh
        run: |
          Compress-Archive -Path "${{ matrix.binary }}" -DestinationPath "${{ matrix.archive }}" -Force
          $hash = (Get-FileHash -Path "${{ matrix.archive }}" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.archive }}" | Out-File -Encoding utf8 -FilePath "${{ matrix.archive }}.sha256"

          $installer = Get-ChildItem -Path "target/${{ matrix.target }}/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installer) {
            Write-Error "NSIS installer not found in target/${{ matrix.target }}/release/bundle/nsis/"
            exit 1
          }
          $installerName = $installer.Name
          Copy-Item -Path $installer.FullName -Destination $installerName -Force
          $installerHash = (Get-FileHash -Path $installerName -Algorithm SHA256).Hash.ToLower()
          "$installerHash  $installerName" | Out-File -Encoding utf8 -FilePath "$installerName.sha256"
          "INSTALLER_EXE=$installerName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "INSTALLER_SHA=$installerName.sha256" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows installer asset
        if: ${{ matrix.use_zip }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.INSTALLER_EXE }}
            ${{ env.INSTALLER_SHA }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

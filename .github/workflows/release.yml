name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    name: Build Release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_name: knox-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz
            binary: target/release/knox
            use_zip: false
          - os: macos-latest
            target: x86_64-apple-darwin
            archive_name: knox-${{ github.ref_name }}-x86_64-apple-darwin.tar.gz
            binary: target/release/knox
            use_zip: false
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_name: knox-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz
            binary: target/aarch64-apple-darwin/release/knox
            use_zip: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_name: knox-${{ github.ref_name }}-x86_64-pc-windows-msvc.zip
            binary: target/release/knox.exe
            use_zip: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package release archive (Unix)
        if: ${{ !matrix.use_zip }}
        run: |
          BIN_PATH="${{ matrix.binary }}"
          if [ ! -f "$BIN_PATH" ]; then
            BIN_PATH="target/${{ matrix.target }}/release/knox"
          fi
          chmod +x "$BIN_PATH"
          tar -czvf "${{ matrix.archive_name }}" -C "$(dirname "$BIN_PATH")" "$(basename "$BIN_PATH")"
          shasum -a 256 "${{ matrix.archive_name }}" > "${{ matrix.archive_name }}.sha256"

      - name: Package release archive (Windows)
        if: ${{ matrix.use_zip }}
        shell: pwsh
        run: |
          $binPath = "${{ matrix.binary }}"
          if (-not (Test-Path $binPath)) {
            $binPath = "target/${{ matrix.target }}/release/knox.exe"
          }
          Compress-Archive -Path $binPath -DestinationPath "${{ matrix.archive_name }}" -Force
          $hash = (Get-FileHash -Path "${{ matrix.archive_name }}" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.archive_name }}" | Out-File -Encoding utf8 -FilePath "${{ matrix.archive_name }}.sha256"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.archive_name }}
            ${{ matrix.archive_name }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


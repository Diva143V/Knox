name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    name: Build Release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cli_archive: knox-cli-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz
            desktop_archive: knox-desktop-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz
            binary_cli: target/x86_64-unknown-linux-gnu/release/knox
            binary_desktop: target/x86_64-unknown-linux-gnu/release/knox-desktop
            use_zip: false
          - os: macos-latest
            target: x86_64-apple-darwin
            cli_archive: knox-cli-${{ github.ref_name }}-x86_64-apple-darwin.tar.gz
            desktop_archive: knox-desktop-${{ github.ref_name }}-x86_64-apple-darwin.tar.gz
            binary_cli: target/x86_64-apple-darwin/release/knox
            binary_desktop: target/x86_64-apple-darwin/release/knox-desktop
            use_zip: false
          - os: macos-latest
            target: aarch64-apple-darwin
            cli_archive: knox-cli-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz
            desktop_archive: knox-desktop-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz
            binary_cli: target/aarch64-apple-darwin/release/knox
            binary_desktop: target/aarch64-apple-darwin/release/knox-desktop
            use_zip: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            cli_archive: knox-cli-${{ github.ref_name }}-x86_64-pc-windows-msvc.zip
            desktop_archive: knox-desktop-${{ github.ref_name }}-x86_64-pc-windows-msvc.zip
            binary_cli: target/x86_64-pc-windows-msvc/release/knox.exe
            binary_desktop: target/x86_64-pc-windows-msvc/release/knox-desktop.exe
            use_zip: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install UI dependencies
        run: pnpm --dir ui install --frozen-lockfile

      - name: Build UI assets
        run: pnpm --dir ui build

      - name: Build release binaries
        run: cargo build --workspace --release --target ${{ matrix.target }}

      - name: Package release archives (Unix)
        if: ${{ !matrix.use_zip }}
        run: |
          chmod +x "${{ matrix.binary_cli }}" "${{ matrix.binary_desktop }}"
          tar -czvf "${{ matrix.cli_archive }}" -C "$(dirname "${{ matrix.binary_cli }}")" "$(basename "${{ matrix.binary_cli }}")"
          tar -czvf "${{ matrix.desktop_archive }}" -C "$(dirname "${{ matrix.binary_desktop }}")" "$(basename "${{ matrix.binary_desktop }}")"
          shasum -a 256 "${{ matrix.cli_archive }}" > "${{ matrix.cli_archive }}.sha256"
          shasum -a 256 "${{ matrix.desktop_archive }}" > "${{ matrix.desktop_archive }}.sha256"

      - name: Package release archives (Windows)
        if: ${{ matrix.use_zip }}
        shell: pwsh
        run: |
          Compress-Archive -Path "${{ matrix.binary_cli }}" -DestinationPath "${{ matrix.cli_archive }}" -Force
          Compress-Archive -Path "${{ matrix.binary_desktop }}" -DestinationPath "${{ matrix.desktop_archive }}" -Force
          $cliHash = (Get-FileHash -Path "${{ matrix.cli_archive }}" -Algorithm SHA256).Hash.ToLower()
          "$cliHash  ${{ matrix.cli_archive }}" | Out-File -Encoding utf8 -FilePath "${{ matrix.cli_archive }}.sha256"
          $desktopHash = (Get-FileHash -Path "${{ matrix.desktop_archive }}" -Algorithm SHA256).Hash.ToLower()
          "$desktopHash  ${{ matrix.desktop_archive }}" | Out-File -Encoding utf8 -FilePath "${{ matrix.desktop_archive }}.sha256"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.cli_archive }}
            ${{ matrix.cli_archive }}.sha256
            ${{ matrix.desktop_archive }}
            ${{ matrix.desktop_archive }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
